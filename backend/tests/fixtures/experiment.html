<!DOCTYPE html>
<!--
  Fixture for the verifier tests. Deliberately imperfect: four images with
  missing or empty alt, one wrongly labelled input, one whitespace-only
  label, one unlabelled input, and four contrast failures across inline
  styles and a stylesheet.

  type="box" is not a real input type and is left that way on purpose -- a
  browser falls back to text, and so must we, which is what the
  (type or "text") default in a11y.input_type is for.
-->
<html lang="en">
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Website Visual Comparison</title>  
    <link rel="stylesheet" href="demostyles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>  
    <h1>DEMO WEBSITE</h1>
    <div>
        <img src="images/download.jpeg" id="wv" alt="">
        <img src="images/images (1).jpeg" id="nus" alt="">
        <img src="images/images (14).jpeg" id="mac" >
        <img src="images/images.jpeg" id="tle" >
    </div>

    <div>
        <label for="inp1">wrong labeled</label>
        <div><input id="inp1" type="box" placeholder="ENTER YOUR GMAIL"></div>
       
        <label for="inp2"> </label>
        <div><input id="inp2" type="box" name="name"></div>
        <br>

        <label for="inp3">type something</label>
        <div><input id="inp3" type="box" placeholder="ENTER YOUR PASSWORD" ></div>
        <br>
        <br>

  
        <div><input id="inp4" type="box" placeholder="ENTER YOUR AGE" ></div>
        <br>

    </div>

    <div>
        <div><h2 style="background-color: #000; color: #00f;" >line-1</h2></div>
        <div><h2 style="background-color: black;">line-2</h2></div>
        <div><h2 id="ab">line-3</h2></div>
        <div><h2 id="abc">line-4</h2></div>
    </div>

  </body>
</html>
