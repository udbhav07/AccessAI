<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All four colour sources</title>
  <link rel="stylesheet" href="demo_theme.css">
  <style>
    /* SOURCE 3: <style> block — already in the HTML, no fetch needed. */
    .note { background-color: #000080; color: #4444aa; }   /* 2.0:1 */
  </style>
</head>

<!-- SOURCE 2: legacy presentational attributes (pre-CSS HTML). -->
<body bgcolor="#000000" text="#0000ff" link="#000080">

  <h1>Colour remediation fixture</h1>

  <!-- SOURCE 1: inline style. padding must survive the fix. -->
  <h2 style="background-color:#000; color:#00f; padding:2em">1. inline style</h2>

  <p><font color="#222222">2. legacy &lt;font color&gt; on a black body</font></p>
  <p class="note">3. from the &lt;style&gt; block</p>
  <p class="card">4. from the external stylesheet</p>

  <p>Body text inherits <code>text="#0000ff"</code> on <code>bgcolor="#000000"</code>.</p>
  <p><a href="#">A link, coloured by the legacy link= attribute.</a></p>
</body>
</html>
