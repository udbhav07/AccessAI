name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 3.12 is the floor the pins target; 3.14 is what the project is
      # developed on. A break on either is worth knowing about.
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/test_nethttp.py
      - run: python tests/test_app.py
      - run: python tests/test_colors.py
      - run: python tests/test_verifier.py
